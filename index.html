<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flyzen's Puzzle Challenge!✈️🧩</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            padding: 15px 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 20px 16px;
            box-shadow: 0 20px 50px rgba(0, 40, 90, 0.3);
            max-width: 440px;
            width: 100%;
            border: 5px solid #FFD166;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
        }

        .badge {
            background: #FF477E;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        h1 { color: #1E293B; font-size: 20px; margin: 0 0 6px 0; }
        
        .game-info {
            display: flex;
            gap: 10px;
            font-size: 12px;
            font-weight: 700;
            color: #0284C7;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .diff-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .diff-btn {
            background: #F1F5F9;
            border: 2px solid #CBD5E1;
            color: #475569;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
        }

        .diff-btn.active {
            background: #FFD166;
            border-color: #F59E0B;
            color: #78350F;
        }

        #puzzle-grid {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            display: grid;
            gap: 0;
            background: #ffffff;
            border: 4px solid #38BDF8;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        .tile {
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6), inset 0 0 0 1px rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease, filter 0.1s ease;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            touch-action: manipulation;
        }

        .tile.selected {
            outline: 4px solid #FF477E;
            outline-offset: -4px;
            z-index: 3;
            filter: brightness(1.15);
        }

        #puzzle-grid.solved .tile { box-shadow: none !important; cursor: default; }
        #puzzle-grid.solved { border-color: #06D6A0 !important; }

        .win-box {
            display: none;
            width: 100%;
            background: #E6FFFA;
            border: 3px solid #06D6A0;
            border-radius: 16px;
            padding: 12px;
            margin-top: 14px;
            animation: popIn 0.4s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .stars { font-size: 26px; margin: 4px 0; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn {
            background: #06D6A0;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(6, 214, 160, 0.3);
            touch-action: manipulation;
        }

        .btn:active { transform: scale(0.96); }

        .error-msg {
            color: #E11D48;
            padding: 20px;
            font-size: 14px;
            grid-column: span 3;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">✈️ FLYZEN OFFICIAL ACTIVITY</span>
        <h1 id="levelTitle">Level 1: Sky Explorer 🧩</h1>
        
        <div class="game-info" id="gameInfo">
            <span id="timer">⏱️ 00:00</span>
            <span id="bestTime">🏆 Best: --:--</span>
            <span id="movesCount">👆 Moves: 0</span>
        </div>

        <div class="diff-selector" id="diffSelector">
            <button class="diff-btn active" onclick="changeDifficulty(3, this)">Easy (3x3)</button>
            <button class="diff-btn" onclick="changeDifficulty(4, this)">Medium (4x4)</button>
            <button class="diff-btn" onclick="changeDifficulty(5, this)">Hard (5x5)</button>
        </div>
        
        <div id="puzzle-grid"></div>

        <div id="winBox" class="win-box">
            <h2 style="color: #FF477E; margin: 0; font-size: 20px;">🎉 MISSION COMPLETED! 🎉</h2>
            <div class="stars" id="starRating">⭐⭐⭐</div>
            <div id="winStats" style="color: #0F766E; margin: 5px 0; font-size: 13px; font-weight: bold;"></div>
            
            <div style="background: #FFF9DB; border: 2px dashed #F59E0B; border-radius: 12px; padding: 12px; margin-top: 10px;">
                <p style="color: #78350F; font-size: 14px; margin: 0; font-weight: bold; line-height: 1.5;">
                    ✈️ Head back to your book and solve the activities to unlock the next level!
                </p>
            </div>
        </div>

        <div class="btn-group" id="btnGroup">
            <button class="btn" id="actionBtn" onclick="shuffleTiles()">🔄 Shuffle</button>
        </div>
    </div>

    <img id="secret-source" style="display:none;" />

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const passToken = urlParams.get('p');
        const userKey = urlParams.get('key');
        const DEV_MASTER_KEY = "alpha1995";

        // خريطة الهاش العشوائي غير القابل للتخمين
        const secureDatabase = {
            "a8f3k": { level: 1, img: "puzzle1.jpg", title: "Sky Explorer ✈️" },
            "m2p9x": { level: 2, img: "puzzle2.jpg", title: "Cloud Navigator ☁️" },
            "r7v1q": { level: 3, img: "puzzle3.jpg", title: "Jet Speedster 🚀" },
            "x4b8w": { level: 4, img: "puzzle4.jpg", title: "Star Aviator 🌟" },
            "e9t2z": { level: 5, img: "puzzle5.jpg", title: "Galaxy Captain 👨‍✈️" }
        };

        let currentConfig = secureDatabase[passToken];
        let currentLevel = currentConfig ? currentConfig.level : parseInt(urlParams.get('level')) || 1;
        let imageName = currentConfig ? currentConfig.img : (urlParams.get('img') || `puzzle${currentLevel}.jpg`);

        // وضع المطور وإخفاء الرمز من شريط العنوان فور الفتح
        if (userKey === DEV_MASTER_KEY) {
            currentConfig = { level: currentLevel, img: `puzzle${currentLevel}.jpg`, title: "Dev Mode 🛠️" };
        } else if (currentConfig) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        const grid = document.getElementById('puzzle-grid');
        const hiddenImg = document.getElementById('secret-source');
        const winBox = document.getElementById('winBox');
        const actionBtn = document.getElementById('actionBtn');
        const timerEl = document.getElementById('timer');
        const bestEl = document.getElementById('bestTime');
        const movesEl = document.getElementById('movesCount');
        const gameInfo = document.getElementById('gameInfo');
        const diffSelector = document.getElementById('diffSelector');

        let gridSize = 3;
        let currentOrder = [];
        let selectedIndex = null;
        let moves = 0;
        let timerInterval = null;
        let secondsPassed = 0;

        const titleText = currentConfig ? currentConfig.title : "Sky Puzzle ✈️";
        document.getElementById('levelTitle').innerText = `Level ${currentLevel}: ${titleText}`;

        function playSound(freq, duration = 0.08) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function checkLevelAccess() {
            if (userKey === DEV_MASTER_KEY) return true;

            if (!currentConfig) {
                grid.style.display = 'block';
                grid.innerHTML = `
                    <div style="padding: 35px 15px; text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 10px;">📖🔒</div>
                        <h2 style="color: #1E293B; margin: 0 0 8px 0; font-size: 20px;">Book Access Required!</h2>
                        <p style="color: #64748B; font-size: 14px; margin: 0; line-height: 1.4;">
                            Please scan the official QR code from your <b>Flyzen Activity Book</b> to play! ✈️
                        </p>
                    </div>
                `;
                actionBtn.style.display = 'none';
                diffSelector.style.display = 'none';
                gameInfo.style.display = 'none';
                return false;
            }
            return true;
        }

        function updateBestTimeDisplay() {
            const storageKey = `best_time_lvl_${currentLevel}_grid_${gridSize}`;
            const savedBest = localStorage.getItem(storageKey);

            if (savedBest) {
                const m = String(Math.floor(savedBest / 60)).padStart(2, '0');
                const s = String(savedBest % 60).padStart(2, '0');
                bestEl.innerText = `🏆 Best: ${m}:${s}`;
            } else {
                bestEl.innerText = `🏆 Best: --:--`;
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsPassed = 0;
            timerEl.innerText = '⏱️ 00:00';
            timerInterval = setInterval(() => {
                secondsPassed++;
                const m = String(Math.floor(secondsPassed / 60)).padStart(2, '0');
                const s = String(secondsPassed % 60).padStart(2, '0');
                timerEl.innerText = `⏱️ ${m}:${s}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function changeDifficulty(size, btn) {
            gridSize = size;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initGame();
        }

        function setupGridCSS() {
            const aspectW = hiddenImg.naturalWidth || 1;
            const aspectH = hiddenImg.naturalHeight || 1;
            grid.style.aspectRatio = `${aspectW} / ${aspectH}`;
            grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
        }

        function initGame() {
            if (!checkLevelAccess()) return;
            setupGridCSS();
            currentOrder = Array.from({length: gridSize * gridSize}, (_, i) => i);
            shuffleTiles();
            updateBestTimeDisplay();
        }

        hiddenImg.onerror = () => {
            if (!checkLevelAccess()) return;
            grid.innerHTML = `
                <div class="error-msg">
                    <b>⚠️ Image File Missing!</b><br><br>
                    Could not find <code>"${imageName}"</code> in repository root.
                </div>`;
        };

        hiddenImg.onload = () => initGame();
        hiddenImg.src = imageName;

        if (hiddenImg.complete && hiddenImg.naturalWidth !== 0) {
            initGame();
        }

        function renderGrid() {
            grid.innerHTML = '';
            currentOrder.forEach((pieceId, index) => {
                const tile = document.createElement('div');
                tile.className = 'tile' + (selectedIndex === index ? ' selected' : '');
                
                const origCol = pieceId % gridSize;
                const origRow = Math.floor(pieceId / gridSize);
                
                tile.style.backgroundImage = `url('${imageName}')`;
                tile.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
                
                const posX = (origCol / (gridSize - 1)) * 100;
                const posY = (origRow / (gridSize - 1)) * 100;
                tile.style.backgroundPosition = `${posX}% ${posY}%`;

                tile.onclick = () => handleTileClick(index);
                grid.appendChild(tile);
            });
        }

        function handleTileClick(index) {
            if (grid.classList.contains('solved')) return;

            if (selectedIndex === null) {
                selectedIndex = index;
                playSound(400);
                renderGrid();
            } else if (selectedIndex === index) {
                selectedIndex = null;
                renderGrid();
            } else {
                let temp = currentOrder[selectedIndex];
                currentOrder[selectedIndex] = currentOrder[index];
                currentOrder[index] = temp;
                
                selectedIndex = null;
                moves++;
                movesEl.innerText = `👆 Moves: ${moves}`;
                playSound(600);
                renderGrid();
                checkWin();
            }
        }

        function shuffleTiles() {
            grid.classList.remove('solved');
            winBox.style.display = 'none';
            moves = 0;
            movesEl.innerText = `👆 Moves: 0`;
            
            do {
                currentOrder.sort(() => Math.random() - 0.5);
            } while (checkSolved());
            
            selectedIndex = null;
            renderGrid();
            startTimer();
        }

        function checkSolved() {
            return currentOrder.every((val, index) => val === index);
        }

        function calculateStars() {
            if (secondsPassed < 40) return '⭐⭐⭐';
            if (secondsPassed < 90) return '⭐⭐';
            return '⭐';
        }

        function checkWin() {
            if (checkSolved()) {
                stopTimer();
                grid.classList.add('solved');

                const storageKey = `best_time_lvl_${currentLevel}_grid_${gridSize}`;
                const savedBest = localStorage.getItem(storageKey);
                let isNewRecord = false;

                if (!savedBest || secondsPassed < parseInt(savedBest)) {
                    localStorage.setItem(storageKey, secondsPassed);
                    isNewRecord = true;
                    updateBestTimeDisplay();
                }

                setTimeout(() => {
                    playSound(800, 0.3);
                    confetti({ particleCount: 130, spread: 85, origin: { y: 0.6 } });
                    document.getElementById('starRating').innerText = calculateStars();
                    
                    let statsHTML = `Time: ${secondsPassed}s | Moves: ${moves}`;
                    if (isNewRecord) {
                        statsHTML = `<div style="color: #D97706; font-size: 14px; margin-bottom: 4px;">👑 NEW RECORD! 👑</div>` + statsHTML;
                    }

                    document.getElementById('winStats').innerHTML = statsHTML;
                    winBox.style.display = 'block';
                    actionBtn.style.display = 'none';
                }, 200);
            }
        }
    </script>
</body>
</html>
