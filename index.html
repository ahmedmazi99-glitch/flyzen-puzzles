<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flyzen's Sky Puzzle Challenge! ✈️🧩</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
        }
        
        body {
            margin: 0;
            padding: 20px 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 32px;
            padding: 25px 20px;
            box-shadow: 0 20px 50px rgba(0, 40, 90, 0.3);
            max-width: 450px;
            width: 100%;
            border: 6px solid #FFD166;
        }

        .badge {
            background: #FF477E;
            color: white;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        h1 { color: #1E293B; font-size: 28px; margin: 0 0 6px 0; }
        p { color: #64748B; font-size: 15px; margin: 0 0 20px 0; }

        #puzzle-grid {
            width: 360px;
            height: 360px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 0;
            background: #ffffff;
            border: 4px solid #38BDF8;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
        }

        .tile {
            width: 120px;
            height: 120px;
            background-size: 360px 360px;
            cursor: pointer;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.8), inset 0 0 0 3px rgba(0, 0, 0, 0.15);
            transition: transform 0.12s ease, filter 0.12s ease;
            position: relative;
        }

        .tile:hover {
            filter: brightness(1.08);
            z-index: 2;
        }

        .tile.selected {
            outline: 5px solid #FF477E;
            outline-offset: -5px;
            z-index: 3;
            filter: brightness(1.15);
        }

        .btn {
            background: #06D6A0;
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            margin-top: 22px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(6, 214, 160, 0.35);
            transition: transform 0.1s ease;
        }

        .btn:active { transform: scale(0.96); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 35px 25px;
            border-radius: 30px;
            text-align: center;
            border: 6px solid #06D6A0;
            max-width: 85%;
        }

        .error-msg {
            grid-column: span 3;
            grid-row: span 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #FFE4E6;
            color: #E11D48;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">✈️ FLYZEN OFFICIAL ACTIVITY</span>
        <h1>Captain Flyzen's Puzzle! 🧩</h1>
        <p>Click two pieces to swap them and complete the picture!</p>
        
        <div id="puzzle-grid">
            <div style="grid-column: span 3; grid-row: span 3; display: flex; align-items: center; justify-content: center; color: #0284C7; font-weight: bold;">
                Loading Flyzen's Sky... ✈️
            </div>
        </div>

        <button class="btn" onclick="shuffleTiles()">🔄 Shuffle Pieces</button>
    </div>

    <div id="winModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #FF477E; margin: 0 0 10px 0; font-size: 30px;">🎉 SUPER PILOT WIN! 🎉</h2>
            <p style="color: #1E293B; font-size: 18px;">You completed Flyzen's puzzle! ✈️🏆</p>
            <button class="btn" onclick="closeModal()">Play Again 🚀</button>
        </div>
    </div>

    <img id="secret-source" style="display:none;" />

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imageName = urlParams.get('img') || 'puzzle1.png';

        const grid = document.getElementById('puzzle-grid');
        const hiddenImg = document.getElementById('secret-source');
        
        let currentOrder = [0, 1, 2, 3, 4, 5, 6, 7, 8];
        let selectedIndex = null;
        let isLoaded = false;

        function playSound(freq, duration = 0.08) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function initGame() {
            if (isLoaded) return;
            isLoaded = true;
            shuffleTiles();
        }

        hiddenImg.onerror = () => {
            grid.innerHTML = `
                <div class="error-msg">
                    <b>⚠️ Image File Missing!</b><br><br>
                    Could not find <code>"${imageName}"</code> in repository root.
                </div>`;
        };

        hiddenImg.onload = () => {
            initGame();
        };

        hiddenImg.src = imageName;

        if (hiddenImg.complete && hiddenImg.naturalWidth !== 0) {
            initGame();
        }

        function renderGrid() {
            grid.innerHTML = '';
            currentOrder.forEach((pieceId, index) => {
                const tile = document.createElement('div');
                tile.className = 'tile' + (selectedIndex === index ? ' selected' : '');
                
                const origCol = pieceId % 3;
                const origRow = Math.floor(pieceId / 3);
                
                tile.style.backgroundImage = `url('${imageName}')`;
                tile.style.backgroundPosition = `-${origCol * 120}px -${origRow * 120}px`;

                tile.onclick = () => handleTileClick(index);
                grid.appendChild(tile);
            });
        }

        function handleTileClick(index) {
            if (selectedIndex === null) {
                selectedIndex = index;
                playSound(400);
                renderGrid();
            } else if (selectedIndex === index) {
                selectedIndex = null;
                renderGrid();
            } else {
                const temp = currentOrder[selectedIndex];
                currentOrder[selectedIndex] = currentOrder[index];
                currentOrder[index] = temp;
                
                selectedIndex = null;
                playSound(600);
                renderGrid();
                checkWin();
            }
        }

        function shuffleTiles() {
            do {
                currentOrder.sort(() => Math.random() - 0.5);
            } while (checkSolved());
            
            selectedIndex = null;
            renderGrid();
        }

        function checkSolved() {
            return currentOrder.every((val, index) => val === index);
        }

        function checkWin() {
            if (checkSolved()) {
                setTimeout(() => {
                    playSound(800, 0.3);
                    confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
                    document.getElementById('winModal').style.display = 'flex';
                }, 200);
            }
        }

        function closeModal() {
            document.getElementById('winModal').style.display = 'none';
            shuffleTiles();
        }
    </script>
</body>
</html>
