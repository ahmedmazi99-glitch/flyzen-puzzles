<script>
    const urlParams = new URLSearchParams(window.location.search);
    let currentLevel = parseInt(urlParams.get('level')) || 1;
    const imageName = urlParams.get('img') || `puzzle${currentLevel}.jpg`;

    // 1. تفعيل المستوى الأول دائماً تلقائياً
    if (currentLevel === 1) {
        localStorage.setItem('unlocked_level_1', 'true');
    }

    // 2. قائمة أسماء المستويات المخصصة
    const levelTitles = {
        1: "Sky Explorer ✈️",
        2: "Cloud Navigator ☁️",
        3: "Jet Speedster 🚀",
        4: "Star Aviator 🌟",
        5: "Galaxy Captain 👨‍✈️"
    };

    // 3. دالة موحدة للتنقل بين المستويات تضمن تحديث الرابط والصورة ونظافة البيانات
    function goToLevel(lvl) {
        window.location.search = `?level=${lvl}&img=puzzle${lvl}.jpg`;
    }

    // 4. تحديث عنوان الصفحة فور تحميلها
    function updateLevelTitle() {
        const titleName = levelTitles[currentLevel] || "Sky Puzzle ✈️";
        document.getElementById('levelTitle').innerText = `Level ${currentLevel}: ${titleName}`;
    }
    updateLevelTitle();

    const grid = document.getElementById('puzzle-grid');
    const hiddenImg = document.getElementById('secret-source');
    const winBox = document.getElementById('winBox');
    const nextBtn = document.getElementById('nextBtn');
    const actionBtn = document.getElementById('actionBtn');
    const timerEl = document.getElementById('timer');
    const bestEl = document.getElementById('bestTime');
    const movesEl = document.getElementById('movesCount');
    const gameInfo = document.getElementById('gameInfo');
    const diffSelector = document.getElementById('diffSelector');

    let gridSize = 3;
    let currentOrder = [];
    let selectedIndex = null;
    let moves = 0;
    let timerInterval = null;
    let secondsPassed = 0;

    function playSound(freq, duration = 0.08) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + duration);
        } catch(e) {}
    }

    function checkLevelAccess() {
        const isUnlocked = localStorage.getItem(`unlocked_level_${currentLevel}`) === 'true';
        
        if (!isUnlocked && currentLevel > 1) {
            const prevLevel = currentLevel - 1;
            grid.style.display = 'block';
            grid.innerHTML = `
                <div style="padding: 35px 15px; text-align: center;">
                    <div style="font-size: 48px; margin-bottom: 10px;">🔒</div>
                    <h2 style="color: #1E293B; margin: 0 0 8px 0; font-size: 20px;">Level ${currentLevel} is Locked!</h2>
                    <p style="color: #64748B; font-size: 14px; margin: 0 0 18px 0; line-height: 1.4;">
                        You must complete <b>Level ${prevLevel}</b> first to unlock Flyzen's next adventure! ✈️
                    </p>
                    <button class="btn" style="margin: 0;" onclick="goToLevel(${prevLevel})">
                        Play Level ${prevLevel} Now 🚀
                    </button>
                </div>
            `;
            
            actionBtn.style.display = 'none';
            diffSelector.style.display = 'none';
            gameInfo.style.display = 'none';
            return false;
        }
        return true;
    }

    function updateBestTimeDisplay() {
        const storageKey = `best_time_lvl_${currentLevel}_grid_${gridSize}`;
        const savedBest = localStorage.getItem(storageKey);

        if (savedBest) {
            const m = String(Math.floor(savedBest / 60)).padStart(2, '0');
            const s = String(savedBest % 60).padStart(2, '0');
            bestEl.innerText = `🏆 Best: ${m}:${s}`;
        } else {
            bestEl.innerText = `🏆 Best: --:--`;
        }
    }

    function startTimer() {
        clearInterval(timerInterval);
        secondsPassed = 0;
        timerEl.innerText = '⏱️ 00:00';
        timerInterval = setInterval(() => {
            secondsPassed++;
            const m = String(Math.floor(secondsPassed / 60)).padStart(2, '0');
            const s = String(secondsPassed % 60).padStart(2, '0');
            timerEl.innerText = `⏱️ ${m}:${s}`;
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    function changeDifficulty(size, btn) {
        gridSize = size;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        initGame();
    }

    function setupGridCSS() {
        const aspectW = hiddenImg.naturalWidth || 1;
        const aspectH = hiddenImg.naturalHeight || 1;
        grid.style.aspectRatio = `${aspectW} / ${aspectH}`;
        grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
        grid.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
    }

    function initGame() {
        if (!checkLevelAccess()) return;
        setupGridCSS();
        currentOrder = Array.from({length: gridSize * gridSize}, (_, i) => i);
        shuffleTiles();
        updateBestTimeDisplay();
    }

    hiddenImg.onerror = () => {
        if (!checkLevelAccess()) return;
        grid.innerHTML = `
            <div class="error-msg">
                <b>⚠️ Image File Missing!</b><br><br>
                Could not find <code>"${imageName}"</code> in repository root.
            </div>`;
    };

    hiddenImg.onload = () => initGame();
    hiddenImg.src = imageName;

    if (hiddenImg.complete && hiddenImg.naturalWidth !== 0) {
        initGame();
    }

    function renderGrid() {
        grid.innerHTML = '';
        currentOrder.forEach((pieceId, index) => {
            const tile = document.createElement('div');
            tile.className = 'tile' + (selectedIndex === index ? ' selected' : '');
            
            const origCol = pieceId % gridSize;
            const origRow = Math.floor(pieceId / gridSize);
            
            tile.style.backgroundImage = `url('${imageName}')`;
            tile.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
            
            const posX = (origCol / (gridSize - 1)) * 100;
            const posY = (origRow / (gridSize - 1)) * 100;
            tile.style.backgroundPosition = `${posX}% ${posY}%`;

            tile.onclick = () => handleTileClick(index);
            grid.appendChild(tile);
        });
    }

    function handleTileClick(index) {
        if (grid.classList.contains('solved')) return;

        if (selectedIndex === null) {
            selectedIndex = index;
            playSound(400);
            renderGrid();
        } else if (selectedIndex === index) {
            selectedIndex = null;
            renderGrid();
        } else {
            let temp = currentOrder[selectedIndex];
            currentOrder[selectedIndex] = currentOrder[index];
            currentOrder[index] = temp;
            
            selectedIndex = null;
            moves++;
            movesEl.innerText = `👆 Moves: ${moves}`;
            playSound(600);
            renderGrid();
            checkWin();
        }
    }

    function shuffleTiles() {
        grid.classList.remove('solved');
        winBox.style.display = 'none';
        nextBtn.style.display = 'none';
        moves = 0;
        movesEl.innerText = `👆 Moves: 0`;
        
        do {
            currentOrder.sort(() => Math.random() - 0.5);
        } while (checkSolved());
        
        selectedIndex = null;
        renderGrid();
        startTimer();
    }

    function checkSolved() {
        return currentOrder.every((val, index) => val === index);
    }

    function calculateStars() {
        if (secondsPassed < 40) return '⭐⭐⭐';
        if (secondsPassed < 90) return '⭐⭐';
        return '⭐';
    }

    function checkWin() {
        if (checkSolved()) {
            stopTimer();
            grid.classList.add('solved');
            
            localStorage.setItem(`unlocked_level_${currentLevel + 1}`, 'true');

            const storageKey = `best_time_lvl_${currentLevel}_grid_${gridSize}`;
            const savedBest = localStorage.getItem(storageKey);
            let isNewRecord = false;

            if (!savedBest || secondsPassed < parseInt(savedBest)) {
                localStorage.setItem(storageKey, secondsPassed);
                isNewRecord = true;
                updateBestTimeDisplay();
            }

            setTimeout(() => {
                playSound(800, 0.3);
                confetti({ particleCount: 130, spread: 85, origin: { y: 0.6 } });
                document.getElementById('starRating').innerText = calculateStars();
                
                let statsHTML = `Time: ${secondsPassed}s | Moves: ${moves}`;
                if (isNewRecord) {
                    statsHTML = `<div style="color: #D97706; font-size: 14px; margin-bottom: 4px;">👑 NEW RECORD! 👑</div>` + statsHTML;
                }

                document.getElementById('winStats').innerHTML = statsHTML;
                winBox.style.display = 'block';
                nextBtn.style.display = 'inline-block';
            }, 200);
        }
    }

    function loadNextLevel() {
        goToLevel(currentLevel + 1);
    }
</script>
