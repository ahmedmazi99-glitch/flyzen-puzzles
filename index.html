<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flyzen's Sky Puzzle Challenge! ✈️🧩</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
        }
        
        body {
            margin: 0;
            padding: 20px 10px 40px 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 32px;
            padding: 25px 20px;
            box-shadow: 0 20px 50px rgba(0, 40, 90, 0.3);
            max-width: 520px;
            width: 100%;
            border: 6px solid #FFD166;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .badge {
            background: #FF477E;
            color: white;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        h1 { color: #1E293B; font-size: 28px; margin: 0 0 6px 0; }
        p { color: #64748B; font-size: 15px; margin: 0 0 20px 0; }

        #puzzle-grid {
            margin: 0 auto;
            display: grid;
            gap: 0;
            background: #ffffff;
            border: 4px solid #38BDF8;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        .tile {
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6), inset 0 0 0 2px rgba(0, 0, 0, 0.12);
            transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.3s ease;
            position: relative;
        }

        /* Remove grid outlines when solved to show full seamless image */
        #puzzle-grid.solved .tile {
            box-shadow: none !important;
            cursor: default;
        }

        #puzzle-grid.solved {
            border-color: #06D6A0;
            box-shadow: 0 0 30px rgba(6, 214, 160, 0.6);
        }

        .tile:hover {
            filter: brightness(1.08);
            z-index: 2;
        }

        .tile.selected {
            outline: 5px solid #FF477E;
            outline-offset: -5px;
            z-index: 3;
            filter: brightness(1.15);
        }

        .btn {
            background: #06D6A0;
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            margin-top: 22px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(6, 214, 160, 0.35);
            transition: transform 0.1s ease;
        }

        .btn:active { transform: scale(0.96); }

        /* Floating victory card at the bottom - Doesn't block the picture! */
        .win-banner {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: 90%;
            max-width: 440px;
            pointer-events: none;
        }

        .win-banner-content {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            padding: 20px 25px;
            border-radius: 28px;
            text-align: center;
            border: 5px solid #06D6A0;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            pointer-events: auto;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .error-msg {
            color: #E11D48;
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">✈️ FLYZEN OFFICIAL ACTIVITY</span>
        <h1>Captain Flyzen's Puzzle! 🧩</h1>
        <p>Click two pieces to swap them and complete the picture!</p>
        
        <div id="puzzle-grid">
            <div id="loading-box" style="padding: 40px; color: #0284C7; font-weight: bold;">
                Loading Flyzen's Sky... ✈️
            </div>
        </div>

        <button class="btn" onclick="shuffleTiles()">🔄 Shuffle Pieces</button>
    </div>

    <!-- Floating Banner Overlay -->
    <div id="winBanner" class="win-banner">
        <div class="win-banner-content">
            <h2 style="color: #FF477E; margin: 0 0 6px 0; font-size: 26px;">🎉 SUPER PILOT WIN! 🎉</h2>
            <p style="color: #1E293B; font-size: 16px; margin: 0 0 12px 0;">Great job! You unlocked the full picture! ✈️🏆</p>
            <button class="btn" style="margin-top:0; padding: 10px 28px; font-size: 16px;" onclick="closeModal()">Play Again 🚀</button>
        </div>
    </div>

    <img id="secret-source" style="display:none;" />

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imageName = urlParams.get('img') || 'puzzle1.png';

        const grid = document.getElementById('puzzle-grid');
        const hiddenImg = document.getElementById('secret-source');
        
        let currentOrder = [0, 1, 2, 3, 4, 5, 6, 7, 8];
        let selectedIndex = null;
        let isLoaded = false;
        let puzzleW = 360;
        let puzzleH = 470;
        let pieceW = 120;
        let pieceH = 156;

        function playSound(freq, duration = 0.08) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        function setupDimensions() {
            const aspectRatio = hiddenImg.naturalHeight / hiddenImg.naturalWidth;
            const maxW = Math.min(window.innerWidth - 60, 420);
            
            pieceW = Math.floor(maxW / 3);
            puzzleW = pieceW * 3;
            
            pieceH = Math.floor((puzzleW * aspectRatio) / 3);
            puzzleH = pieceH * 3;

            grid.style.width = puzzleW + 'px';
            grid.style.height = puzzleH + 'px';
            grid.style.gridTemplateColumns = `repeat(3, ${pieceW}px)`;
            grid.style.gridTemplateRows = `repeat(3, ${pieceH}px)`;
        }

        function initGame() {
            if (isLoaded) return;
            isLoaded = true;
            setupDimensions();
            shuffleTiles();
        }

        hiddenImg.onerror = () => {
            grid.innerHTML = `
                <div class="error-msg">
                    <b>⚠️ Image File Missing!</b><br><br>
                    Could not find <code>"${imageName}"</code> in repository root.
                </div>`;
        };

        hiddenImg.onload = () => {
            initGame();
        };

        hiddenImg.src = imageName;

        if (hiddenImg.complete && hiddenImg.naturalWidth !== 0) {
            initGame();
        }

        function renderGrid() {
            grid.innerHTML = '';
            currentOrder.forEach((pieceId, index) => {
                const tile = document.createElement('div');
                tile.className = 'tile' + (selectedIndex === index ? ' selected' : '');
                
                const origCol = pieceId % 3;
                const origRow = Math.floor(pieceId / 3);
                
                tile.style.width = pieceW + 'px';
                tile.style.height = pieceH + 'px';
                tile.style.backgroundImage = `url('${imageName}')`;
                tile.style.backgroundSize = `${puzzleW}px ${puzzleH}px`;
                tile.style.backgroundPosition = `-${origCol * pieceW}px -${origRow * pieceH}px`;

                tile.onclick = () => handleTileClick(index);
                grid.appendChild(tile);
            });
        }

        function handleTileClick(index) {
            if (grid.classList.contains('solved')) return;

            if (selectedIndex === null) {
                selectedIndex = index;
                playSound(400);
                renderGrid();
            } else if (selectedIndex === index) {
                selectedIndex = null;
                renderGrid();
            } else {
                const temp = currentOrder[selectedIndex];
                currentOrder[selectedIndex] = currentOrder[index];
                currentOrder[index] = temp;
                
                selectedIndex = null;
                playSound(600);
                renderGrid();
                checkWin();
            }
        }

        function shuffleTiles() {
            grid.classList.remove('solved');
            document.getElementById('winBanner').style.display = 'none';

            do {
                currentOrder.sort(() => Math.random() - 0.5);
            } while (checkSolved());
            
            selectedIndex = null;
            renderGrid();
        }

        function checkSolved() {
            return currentOrder.every((val, index) => val === index);
        }

        function checkWin() {
            if (checkSolved()) {
                grid.classList.add('solved');
                setTimeout(() => {
                    playSound(800, 0.3);
                    confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
                    document.getElementById('winBanner').style.display = 'block';
                }, 200);
            }
        }

        function closeModal() {
            document.getElementById('winBanner').style.display = 'none';
            shuffleTiles();
        }
    </script>
</body>
</html>
