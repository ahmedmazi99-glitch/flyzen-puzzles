<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flyzen 3D Jigsaw Challenge ✈️</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        
        body {
            margin: 0;
            padding: 10px;
            background: linear-gradient(135deg, #0284C7 0%, #092C4C 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            overflow: hidden;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            max-width: 460px;
            width: 100%;
            border: 4px solid #FFD166;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .badge {
            background: #FF477E;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        h1 { color: #1E293B; font-size: 18px; margin: 5px 0; }

        .watermark {
            position: absolute;
            bottom: 8px;
            right: 15px;
            font-size: 10px;
            color: rgba(0, 0, 0, 0.35);
            font-weight: bold;
            pointer-events: none;
        }

        #canvas-container {
            width: 100%;
            position: relative;
            margin-top: 10px;
            border-radius: 16px;
            overflow: hidden;
            background: #E2E8F0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
        }

        .win-box {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            background: rgba(255, 255, 255, 0.98);
            border: 3px solid #06D6A0;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 10;
        }

        .btn {
            background: #06D6A0;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(6, 214, 160, 0.4);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="card">
        <span class="badge">✈️ FLYZEN REAL 3D JIGSAW</span>
        <h1 id="levelTitle">Sky Explorer Puzzle 🧩</h1>
        
        <div id="canvas-container">
            <canvas id="jigsawCanvas"></canvas>
        </div>

        <div id="winBox" class="win-box">
            <h2 style="color: #FF477E; margin: 0; font-size: 18px;">🎉 EXCELLENT JOB! 🎉</h2>
            <p style="color: #475569; font-size: 12px; margin: 5px 0;">You solved the 3D Flyzen Jigsaw!</p>
            <button class="btn" onclick="initJigsaw()">🔄 Play Again</button>
        </div>

        <div class="watermark">© FLYZEN BY AHMED MAZIGHI</div>
    </div>

    <script>
        // --- 🛡️ SECURITY & ANTI-INSPECT PROTECTION ---
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                e.preventDefault();
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        let passToken = urlParams.get('p') ? urlParams.get('p').toLowerCase() : sessionStorage.getItem('flyzen_active_token');
        
        const secureDatabase = {
            "a8f3k": { level: 1, img: "puzzle1.jpg" },
            "m2p9x": { level: 2, img: "puzzle2.jpg" },
            "r7v1q": { level: 3, img: "puzzle3.jpg" }
        };

        let config = secureDatabase[passToken] || { level: 1, img: "puzzle1.jpg" };
        if (passToken) sessionStorage.setItem('flyzen_active_token', passToken);

        const canvas = document.getElementById('jigsawCanvas');
        const ctx = canvas.getContext('2d');
        const winBox = document.getElementById('winBox');

        const rows = 3;
        const cols = 3;
        let pieces = [];
        let selectedPiece = null;
        let dragOffset = { x: 0, y: 0 };
        let img = new Image();
        
        let boardWidth, boardHeight, pieceWidth, pieceHeight;
        let trayHeight = 120; // منطقة بعثرة القطع بالأسفل

        img.src = config.img;
        img.onload = () => initJigsaw();

        function initJigsaw() {
            winBox.style.display = 'none';
            const containerWidth = document.getElementById('canvas-container').clientWidth;
            
            boardWidth = containerWidth;
            boardHeight = containerWidth * (img.naturalHeight / img.naturalWidth);
            
            canvas.width = boardWidth;
            canvas.height = boardHeight + trayHeight;

            pieceWidth = boardWidth / cols;
            pieceHeight = boardHeight / rows;

            generatePieces();
            draw();
        }

        function generatePieces() {
            pieces = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    // حساب حواف التشابك العشوائية (Tabs: 1, Holes: -1, Flat: 0)
                    let edges = {
                        top: r === 0 ? 0 : -pieces[(r - 1) * cols + c].edges.bottom,
                        right: c === cols - 1 ? 0 : (Math.random() < 0.5 ? 1 : -1),
                        bottom: r === rows - 1 ? 0 : (Math.random() < 0.5 ? 1 : -1),
                        left: c === 0 ? 0 : -pieces[r * cols + (c - 1)].edges.right
                    };

                    // بعثرة القطع بالأسفل خارج الإطار
                    let randomX = Math.random() * (boardWidth - pieceWidth);
                    let randomY = boardHeight + 10 + Math.random() * (trayHeight - pieceHeight - 10);

                    pieces.push({
                        r, c,
                        targetX: c * pieceWidth,
                        targetY: r * pieceHeight,
                        x: randomX,
                        y: randomY,
                        edges,
                        isLocked: false
                    });
                }
            }
        }

        // رسم حافة البزل المتشابكة الحقيقية 3D
        function drawPiecePath(context, p, x, y) {
            context.beginPath();
            context.moveTo(x, y);

            // Top Edge
            drawEdge(context, x, y, x + pieceWidth, y, p.edges.top);
            // Right Edge
            drawEdge(context, x + pieceWidth, y, x + pieceWidth, y + pieceHeight, p.edges.right);
            // Bottom Edge
            drawEdge(context, x + pieceWidth, y + pieceHeight, x, y + pieceHeight, p.edges.bottom);
            // Left Edge
            drawEdge(context, x, y + pieceHeight, x, y, p.edges.left);

            context.closePath();
        }

        function drawEdge(context, x1, y1, x2, y2, tab) {
            if (tab === 0) {
                context.lineTo(x2, y2);
                return;
            }
            let dx = x2 - x1;
            let dy = y2 - y1;
            let dist = Math.hypot(dx, dy);

            let nx = -dy / dist;
            let ny = dx / dist;

            let cx1 = x1 + dx * 0.35;
            let cy1 = y1 + dy * 0.35;
            let cx2 = x1 + dx * 0.65;
            let cy2 = y1 + dy * 0.65;

            let tabSize = dist * 0.2 * tab;

            let tabX = x1 + dx * 0.5 + nx * tabSize;
            let tabY = y1 + dy * 0.5 + ny * tabSize;

            context.lineTo(cx1, cy1);
            context.bezierCurveTo(cx1 + nx * tabSize, cy1 + ny * tabSize, tabX - dx * 0.1, tabY - dy * 0.1, tabX, tabY);
            context.bezierCurveTo(tabX + dx * 0.1, tabY + dy * 0.1, cx2 + nx * tabSize, cy2 + ny * tabSize, cx2, cy2);
            context.lineTo(x2, y2);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم لوحة الهدف الخلفية المعتمة
            ctx.fillStyle = "#CBD5E1";
            ctx.fillRect(0, 0, boardWidth, boardHeight);
            
            // رسم شبكة اللوحة
            ctx.strokeStyle = "#94A3B8";
            ctx.lineWidth = 1;
            for(let r=0; r<=rows; r++) {
                ctx.beginPath(); ctx.moveTo(0, r*pieceHeight); ctx.lineTo(boardWidth, r*pieceHeight); ctx.stroke();
            }
            for(let c=0; c<=cols; c++) {
                ctx.beginPath(); ctx.moveTo(c*pieceWidth, 0); ctx.lineTo(c*pieceWidth, boardHeight); ctx.stroke();
            }

            // رسم منطقة البعثرة بالأسفل
            ctx.fillStyle = "#F1F5F9";
            ctx.fillRect(0, boardHeight, boardWidth, trayHeight);
            ctx.fillStyle = "#64748B";
            ctx.font = "12px Fredoka";
            ctx.fillText("🧩 Drag pieces from here to the board", 15, boardHeight + 20);

            // رسم القطع
            pieces.forEach(p => {
                ctx.save();
                
                // تأثيرات 3D (ظلال مرتفعة للقطع غير المثبتة)
                if (!p.isLocked) {
                    ctx.shadowColor = "rgba(0,0,0,0.35)";
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 4;
                }

                drawPiecePath(ctx, p, p.x, p.y);
                ctx.clip();

                // رسم جزء الصورة داخل حافة البزل
                let sx = p.c * (img.naturalWidth / cols);
                let sy = p.r * (img.naturalHeight / rows);
                let sw = img.naturalWidth / cols;
                let sh = img.naturalHeight / rows;

                ctx.drawImage(img, sx - 10, sy - 10, sw + 20, sh + 20, p.x - 10, p.y - 10, pieceWidth + 20, pieceHeight + 20);

                // إطار القطعة الذهبي/3D
                ctx.strokeStyle = p.isLocked ? "rgba(6, 214, 160, 0.8)" : "#FFFFFF";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            });
        }

        // --- التفاعل والتحريك (TOUCH & MOUSE EVENTS) ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            const pos = getPos(e);
            for (let i = pieces.length - 1; i >= 0; i--) {
                let p = pieces[i];
                if (!p.isLocked && pos.x >= p.x && pos.x <= p.x + pieceWidth && pos.y >= p.y && pos.y <= p.y + pieceHeight) {
                    selectedPiece = p;
                    dragOffset = { x: pos.x - p.x, y: pos.y - p.y };
                    // رفع القطعة المحددة للأعلى لتبدو فوق بقية القطع
                    pieces.splice(i, 1);
                    pieces.push(p);
                    break;
                }
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (selectedPiece) {
                const pos = getPos(e);
                selectedPiece.x = pos.x - dragOffset.x;
                selectedPiece.y = pos.y - dragOffset.y;
                draw();
            }
        });

        canvas.addEventListener('pointerup', () => {
            if (selectedPiece) {
                // التثبيت التلقائي (Snap-To-Grid) عند الاقتراب من المكان الصحيح
                let dist = Math.hypot(selectedPiece.x - selectedPiece.targetX, selectedPiece.y - selectedPiece.targetY);
                if (dist < 25) {
                    selectedPiece.x = selectedPiece.targetX;
                    selectedPiece.y = selectedPiece.targetY;
                    selectedPiece.isLocked = true;
                }
                selectedPiece = null;
                draw();
                checkWin();
            }
        });

        function checkWin() {
            if (pieces.every(p => p.isLocked)) {
                setTimeout(() => {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    winBox.style.display = 'block';
                }, 200);
            }
        }
    </script>
</body>
</html>
