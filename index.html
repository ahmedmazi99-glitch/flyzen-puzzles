<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flyzen 3D Real Jigsaw ✈️</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            margin: 0;
            padding: 15px 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 18px 14px;
            box-shadow: 0 20px 50px rgba(0, 40, 90, 0.35);
            max-width: 440px;
            width: 100%;
            border: 5px solid #FFD166;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .badge {
            background: #FF477E;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        h1 { color: #1E293B; font-size: 19px; margin: 0 0 6px 0; }
        
        .game-info {
            display: flex;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #0284C7;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .info-pill {
            background: #E0F2FE;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #BAE6FD;
        }

        .diff-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .diff-btn {
            background: #F1F5F9;
            border: 2px solid #CBD5E1;
            color: #475569;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .diff-btn.active {
            background: #FFD166;
            border-color: #F59E0B;
            color: #78350F;
        }

        #canvas-wrapper {
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.6);
            border: 4px solid #38BDF8;
            background: #0B132B;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        .win-box {
            display: none;
            width: 100%;
            background: #E6FFFA;
            border: 3px solid #06D6A0;
            border-radius: 20px;
            padding: 14px;
            margin-top: 12px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .stars { font-size: 26px; margin: 2px 0; }

        .batch-first-banner {
            background: linear-gradient(90deg, #FFD166, #F59E0B);
            color: #78350F;
            font-weight: bold;
            font-size: 11px;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 8px;
            box-shadow: 0 3px 8px rgba(245, 158, 11, 0.4);
        }

        .btn-group { display: flex; gap: 10px; margin-top: 12px; }

        .btn {
            background: #06D6A0;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(6, 214, 160, 0.3);
        }

        /* 💎 العلامة المائية الشفافة المخصصة باسمك 💎 */
        .watermark {
            margin-top: 12px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: rgba(148, 163, 184, 0.8);
            background: rgba(241, 245, 249, 0.6);
            padding: 4px 14px;
            border-radius: 50px;
            border: 1px solid rgba(203, 213, 225, 0.6);
            pointer-events: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="card">
        <span class="badge">✈️ FLYZEN REAL 3D JIGSAW</span>
        <h1 id="levelTitle">Level 1: Sky Explorer 🧩</h1>
        
        <div class="game-info" id="gameInfo">
            <span class="info-pill" id="timer">⏱️ 00:00</span>
            <span class="info-pill" id="bestTime">🏆 Best: --:--</span>
            <span class="info-pill" id="movesCount">👆 Moves: 0</span>
            <span class="info-pill" id="totalScore">⭐ XP: 0</span>
        </div>

        <div class="diff-selector">
            <button class="diff-btn active" onclick="changeDifficulty(3, this)">Easy (3x3)</button>
            <button class="diff-btn" onclick="changeDifficulty(4, this)">Medium (4x4)</button>
            <button class="diff-btn" onclick="changeDifficulty(5, this)">Hard (5x5)</button>
        </div>
        
        <div id="canvas-wrapper">
            <canvas id="jigsawCanvas"></canvas>
        </div>

        <div id="winBox" class="win-box">
            <div id="batchRankBanner" class="batch-first-banner" style="display:none;"></div>
            <h2 style="color: #FF477E; margin: 0; font-size: 19px;">🎉 MISSION COMPLETED! 🎉</h2>
            <div class="stars" id="starRating">⭐⭐⭐</div>
            <div id="winStats" style="color: #0F766E; margin: 4px 0; font-size: 12px; font-weight: bold;"></div>
            
            <div style="background: linear-gradient(135deg, #FFF9DB 0%, #FEF3C7 100%); border: 3px dashed #F59E0B; border-radius: 16px; padding: 10px; margin-top: 8px;">
                <div id="rankBadgeIcon" style="font-size: 30px; margin-bottom: 0;">🥇</div>
                <div style="color: #92400E; font-size: 10px; font-weight: 700; letter-spacing: 1px;">FLIGHT PROMOTION CERTIFICATE</div>
                <div id="rankTitle" style="color: #B45309; font-size: 14px; font-weight: bold; margin: 2px 0;">PROMOTED TO JUNIOR CO-PILOT!</div>
                <div id="pointsEarned" style="color: #D97706; font-size: 12px; font-weight: bold; margin-bottom: 4px;">+0 XP EARNED</div>
                <p style="color: #78350F; font-size: 11px; margin: 0; font-weight: bold; line-height: 1.3;">
                    ✈️ Head back to your book and solve the activities to unlock the next level!
                </p>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" id="actionBtn" onclick="shuffleTiles()">🔄 Shuffle</button>
        </div>

        <div class="watermark">BY AHMED MAZIGHI</div>
    </div>

    <script>
        // 🛡️ حماية الحوار والكشف (Anti-DevTools) 🛡️
        document.addEventListener('keydown', function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
                e.preventDefault();
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        let passToken = urlParams.get('p') ? urlParams.get('p').toLowerCase() : sessionStorage.getItem('flyzen_active_token');
        const userKey = urlParams.get('key');
        const DEV_MASTER_KEY = "alpha1995";

        const secureDatabase = {
            "a8f3k": { level: 1, img: "puzzle1.jpg", title: "Sky Explorer ✈️", rank: "Junior Co-Pilot" },
            "m2p9x": { level: 2, img: "puzzle2.jpg", title: "Cloud Navigator ☁️", rank: "Flight Captain" },
            "r7v1q": { level: 3, img: "puzzle3.jpg", title: "Jet Speedster 🚀", rank: "Senior Aviator" },
            "x4b8w": { level: 4, img: "puzzle4.jpg", title: "Star Aviator 🌟", rank: "Wing Commander" },
            "e9t2z": { level: 5, img: "puzzle5.jpg", title: "Galaxy Captain 👨‍✈️", rank: "Chief Commander" }
        };

        let currentConfig = secureDatabase[passToken];
        let currentLevel = currentConfig ? currentConfig.level : parseInt(urlParams.get('level')) || 1;
        let imageName = currentConfig ? currentConfig.img : (urlParams.get('img') || `puzzle${currentLevel}.jpg`);

        if (userKey === DEV_MASTER_KEY) {
            currentConfig = { level: currentLevel, img: `puzzle${currentLevel}.jpg`, title: "Dev Mode 🛠️", rank: "Master Aviator" };
        } else if (currentConfig && passToken) {
            sessionStorage.setItem('flyzen_active_token', passToken);
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        document.getElementById('levelTitle').innerText = `Level ${currentLevel}: ${currentConfig ? currentConfig.title : "Sky Puzzle ✈️"}`;

        const canvas = document.getElementById('jigsawCanvas');
        const ctx = canvas.getContext('2d');
        const winBox = document.getElementById('winBox');
        const actionBtn = document.getElementById('actionBtn');

        let rows = 3, cols = 3;
        let pieces = [];
        let currentOrder = [];
        let selectedIndex = null;
        let moves = 0;
        let secondsPassed = 0;
        let timerInterval = null;
        let isSolved = false;
        let img = new Image();

        let boardW = 360, boardH = 360;
        let pieceW = 120, pieceH = 120;

        let audioCtx = null;
        function playSound(freq, duration = 0.08) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        img.onload = () => initGame();
        img.src = imageName;

        function changeDifficulty(size, btn) {
            rows = size;
            cols = size;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initGame();
        }

        function initGame() {
            const containerW = document.getElementById('canvas-wrapper').clientWidth || 360;
            boardW = containerW;
            boardH = containerW * (img.naturalHeight / img.naturalWidth);

            const dpr = window.devicePixelRatio || 1;
            canvas.width = boardW * dpr;
            canvas.height = boardH * dpr;
            ctx.scale(dpr, dpr);

            pieceW = boardW / cols;
            pieceH = boardH / rows;

            generatePieces();
            shuffleTiles();
            updateScoreDisplays();
        }

        function generatePieces() {
            pieces = [];
            let hEdges = Array.from({length: rows - 1}, () => Array.from({length: cols}, () => Math.random() < 0.5 ? 1 : -1));
            let vEdges = Array.from({length: rows}, () => Array.from({length: cols - 1}, () => Math.random() < 0.5 ? 1 : -1));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let edges = {
                        top: r === 0 ? 0 : -hEdges[r - 1][c],
                        right: c === cols - 1 ? 0 : vEdges[r][c],
                        bottom: r === rows - 1 ? 0 : hEdges[r][c],
                        left: c === 0 ? 0 : -vEdges[r][c - 1]
                    };

                    pieces.push({
                        id: r * cols + c,
                        origR: r,
                        origC: c,
                        edges
                    });
                }
            }
        }

        function drawJigsawEdge(ctx, x1, y1, x2, y2, tab) {
            if (tab === 0) {
                ctx.lineTo(x2, y2);
                return;
            }
            const dx = x2 - x1;
            const dy = y2 - y1;
            const l = Math.hypot(dx, dy);
            const uX = dx / l;
            const uY = dy / l;
            const nX = -uY * tab;
            const nY = uX * tab;

            const q1X = x1 + uX * l * 0.35;
            const q1Y = y1 + uY * l * 0.35;
            const q2X = x1 + uX * l * 0.65;
            const q2Y = y1 + uY * l * 0.65;

            const neckDepth = l * 0.04;
            const k1X = q1X - nX * neckDepth;
            const k1Y = q1Y - nY * neckDepth;
            const k2X = q2X - nX * neckDepth;
            const k2Y = q2Y - nY * neckDepth;

            const bulbH = l * 0.18;
            const bulbW = l * 0.16;

            const cX = x1 + uX * l * 0.5 + nX * bulbH;
            const cY = y1 + uY * l * 0.5 + nY * bulbH;

            const b1X = cX - uX * bulbW;
            const b1Y = cY - uY * bulbW;
            const b2X = cX + uX * bulbW;
            const b2Y = cY + uY * bulbW;

            ctx.lineTo(q1X, q1Y);
            ctx.bezierCurveTo(k1X, k1Y, b1X - nX * (bulbH * 0.3), b1Y - nY * (bulbH * 0.3), b1X, b1Y);
            ctx.bezierCurveTo(b1X + nX * (bulbH * 0.6), b1Y + nY * (bulbH * 0.6), b2X + nX * (bulbH * 0.6), b2Y + nY * (bulbH * 0.6), b2X, b2Y);
            ctx.bezierCurveTo(b2X - nX * (bulbH * 0.3), b2Y - nY * (bulbH * 0.3), k2X, k2Y, q2X, q2Y);
            ctx.lineTo(x2, y2);
        }

        function drawPiecePath(ctx, x, y, w, h, edges) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            drawJigsawEdge(ctx, x, y, x + w, y, edges.top);
            drawJigsawEdge(ctx, x + w, y, x + w, y + h, edges.right);
            drawJigsawEdge(ctx, x + w, y + h, x, y + h, edges.bottom);
            drawJigsawEdge(ctx, x, y + h, x, y, edges.left);
            ctx.closePath();
        }

        /* 🎨 دالة الرسم مع تجسيم الـ 3D العميق 🎨 */
        function render() {
            ctx.clearRect(0, 0, boardW, boardH);

            if (isSolved) {
                ctx.drawImage(img, 0, 0, boardW, boardH);
                return;
            }

            ctx.fillStyle = "#0B132B";
            ctx.fillRect(0, 0, boardW, boardH);

            currentOrder.forEach((pieceIdx, gridIdx) => {
                const p = pieces[pieceIdx];
                const gridR = Math.floor(gridIdx / cols);
                const gridC = gridIdx % cols;

                const x = gridC * pieceW;
                const y = gridR * pieceH;

                // 1️⃣ رسم الظل الساقط (Drop Shadow) لجعل القطعة مرتفعة عن اللوحة
                ctx.save();
                ctx.shadowColor = selectedIndex === gridIdx ? "rgba(0, 0, 0, 0.85)" : "rgba(0, 0, 0, 0.55)";
                ctx.shadowBlur = selectedIndex === gridIdx ? 16 : 8;
                ctx.shadowOffsetX = selectedIndex === gridIdx ? 4 : 2;
                ctx.shadowOffsetY = selectedIndex === gridIdx ? 8 : 4;
                
                ctx.fillStyle = "#000000";
                drawPiecePath(ctx, x, y, pieceW, pieceH, p.edges);
                ctx.fill();
                ctx.restore();

                // 2️⃣ رسم صورة البزل داخل المسار
                ctx.save();
                drawPiecePath(ctx, x, y, pieceW, pieceH, p.edges);
                ctx.clip();

                const bleedW = pieceW * 0.3;
                const bleedH = pieceH * 0.3;
                const srcW = img.naturalWidth / cols;
                const srcH = img.naturalHeight / rows;
                const srcX = p.origC * srcW;
                const srcY = p.origR * srcH;

                ctx.drawImage(
                    img,
                    srcX - srcW * 0.3, srcY - srcH * 0.3, srcW * 1.6, srcH * 1.6,
                    x - bleedW, y - bleedH, pieceW * 1.6, pieceH * 1.6
                );

                // 3️⃣ تدرج التجسيم الضوئي (3D Bevel Gradient Overlay)
                let grad = ctx.createLinearGradient(x, y, x + pieceW, y + pieceH);
                grad.addColorStop(0, "rgba(255, 255, 255, 0.35)"); // لمعة من الأعلى
                grad.addColorStop(0.5, "rgba(255, 255, 255, 0.0)");
                grad.addColorStop(1, "rgba(0, 0, 0, 0.35)");       // ظل حافة من الأسفل
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.restore();

                // 4️⃣ رسم حواشي 3D (ظل داكن سفلي + إضاءة عاكسة علوية)
                ctx.save();
                drawPiecePath(ctx, x, y, pieceW, pieceH, p.edges);
                ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";
                ctx.lineWidth = 3;
                ctx.stroke();

                if (selectedIndex === gridIdx) {
                    ctx.strokeStyle = "#FF477E";
                    ctx.lineWidth = 4;
                    ctx.shadowColor = "rgba(255, 71, 126, 0.9)";
                    ctx.shadowBlur = 10;
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
                    ctx.lineWidth = 1.8;
                    ctx.stroke();
                }
                ctx.restore();
            });
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (isSolved) return;
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (boardW / rect.width);
            const clickY = (e.clientY - rect.top) * (boardH / rect.height);

            const c = Math.floor(clickX / pieceW);
            const r = Math.floor(clickY / pieceH);
            const clickedIdx = r * cols + c;

            if (clickedIdx >= 0 && clickedIdx < currentOrder.length) {
                if (selectedIndex === null) {
                    selectedIndex = clickedIdx;
                    playSound(400);
                } else if (selectedIndex === clickedIdx) {
                    selectedIndex = null;
                } else {
                    let temp = currentOrder[selectedIndex];
                    currentOrder[selectedIndex] = currentOrder[clickedIdx];
                    currentOrder[clickedIdx] = temp;

                    selectedIndex = null;
                    moves++;
                    document.getElementById('movesCount').innerText = `👆 Moves: ${moves}`;
                    playSound(600);
                    checkWin();
                }
                render();
            }
        });

        function shuffleTiles() {
            isSolved = false;
            winBox.style.display = 'none';
            document.getElementById('batchRankBanner').style.display = 'none';
            actionBtn.innerText = '🔄 Shuffle';
            moves = 0;
            document.getElementById('movesCount').innerText = `👆 Moves: 0`;
            
            do {
                currentOrder = Array.from({length: rows * cols}, (_, i) => i).sort(() => Math.random() - 0.5);
            } while (checkSolved());

            selectedIndex = null;
            render();
            startTimer();
        }

        function checkSolved() {
            return currentOrder.every((val, index) => val === index);
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsPassed = 0;
            document.getElementById('timer').innerText = '⏱️ 00:00';
            timerInterval = setInterval(() => {
                secondsPassed++;
                const m = String(Math.floor(secondsPassed / 60)).padStart(2, '0');
                const s = String(secondsPassed % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `⏱️ ${m}:${s}`;
            }, 1000);
        }

        function calculateStars() {
            let limit = cols === 3 ? 45 : (cols === 4 ? 90 : 180);
            if (secondsPassed <= limit) return '⭐⭐⭐';
            if (secondsPassed <= limit * 1.5) return '⭐⭐';
            return '⭐';
        }

        function updateScoreDisplays() {
            const savedBest = localStorage.getItem(`best_time_lvl_${currentLevel}_grid_${cols}`);
            if (savedBest) {
                const m = String(Math.floor(savedBest / 60)).padStart(2, '0');
                const s = String(savedBest % 60).padStart(2, '0');
                document.getElementById('bestTime').innerText = `🏆 Best: ${m}:${s}`;
            } else {
                document.getElementById('bestTime').innerText = `🏆 Best: --:--`;
            }

            const totalXP = localStorage.getItem('flyzen_total_xp') || 0;
            document.getElementById('totalScore').innerText = `⭐ XP: ${totalXP}`;
        }

        function checkWin() {
            if (checkSolved()) {
                clearInterval(timerInterval);
                isSolved = true;
                render();

                let earnedXP = Math.max(200, (cols * 600) - (secondsPassed * 2));
                let totalXP = (parseInt(localStorage.getItem('flyzen_total_xp')) || 0) + earnedXP;
                localStorage.setItem('flyzen_total_xp', totalXP);

                const timeKey = `best_time_lvl_${currentLevel}_grid_${cols}`;
                const savedBestTime = localStorage.getItem(timeKey);
                if (!savedBestTime || secondsPassed < parseInt(savedBestTime)) {
                    localStorage.setItem(timeKey, secondsPassed);
                }

                updateScoreDisplays();

                setTimeout(() => {
                    playSound(800, 0.3);
                    confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
                    
                    const stars = calculateStars();
                    document.getElementById('starRating').innerText = stars;
                    document.getElementById('pointsEarned').innerText = `+${earnedXP} XP EARNED!`;
                    
                    let medal = stars === '⭐⭐⭐' ? "🥇" : (stars === '⭐⭐' ? "🥈" : "🥉");
                    document.getElementById('rankBadgeIcon').innerText = medal;

                    const banner = document.getElementById('batchRankBanner');
                    if (stars === '⭐⭐⭐') {
                        banner.innerText = '👑 1ST IN BATCH: LIGHTNING SPEED MASTER! ⚡';
                        banner.style.display = 'block';
                    } else {
                        banner.style.display = 'none';
                    }

                    document.getElementById('winStats').innerHTML = `Time: ${secondsPassed}s | Moves: ${moves}`;
                    if (currentConfig) document.getElementById('rankTitle').innerText = `PROMOTED TO ${currentConfig.rank.toUpperCase()}!`;

                    winBox.style.display = 'block';
                    actionBtn.innerText = '🔄 Play Again';
                }, 100);
            }
        }
    </script>
</body>
</html>
