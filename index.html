<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyzen's Sky Puzzle Challenge! ✈️🧩</title>
    
    <!-- External Libraries -->
    <script src="https://unpkg.com/headbreaker/dist/headbreaker.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
        }
        
        body {
            margin: 0;
            padding: 15px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 75, 145, 0.2);
            max-width: 420px;
            width: 100%;
            border: 5px solid #FFD166;
        }

        .badge {
            background: #FF477E;
            color: white;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        h1 {
            color: #1E293B;
            font-size: 24px;
            margin: 0 0 5px 0;
        }

        p {
            color: #64748B;
            font-size: 14px;
            margin: 0 0 15px 0;
        }

        #puzzle-holder {
            width: 320px;
            height: 320px;
            margin: 0 auto;
            border: 3px dashed #38BDF8;
            border-radius: 16px;
            background: #F8FAFC;
            position: relative;
        }

        .btn {
            background: #06D6A0;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            margin-top: 15px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(6, 214, 160, 0.3);
        }

        .btn:hover { background: #05b88a; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px 20px;
            border-radius: 25px;
            text-align: center;
            border: 5px solid #06D6A0;
            max-width: 80%;
        }

        .error-msg {
            color: #E11D48;
            padding: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card" id="main-card">
        <span class="badge">✈️ FLYZEN OFFICIAL ACTIVITY</span>
        <h1>Captain Flyzen's Puzzle! 🧩</h1>
        <p>Drag and snap the pieces together to complete the picture!</p>
        
        <div id="puzzle-holder">
            <div id="loading-text" style="padding-top: 140px; color: #0284C7; font-weight: bold;">Loading Picture... ✈️</div>
        </div>

        <button class="btn" onclick="shufflePuzzle()">🔄 Shuffle Pieces</button>
    </div>

    <div id="winModal" class="modal">
        <div class="modal-content">
            <h2 style="color: #FF477E; margin-top: 0;">🎉 SUPER PILOT WIN! 🎉</h2>
            <p style="color: #1E293B;">You solved the puzzle! ✈️🏆</p>
            <button class="btn" onclick="closeModal()">Play Again 🚀</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const imageName = urlParams.get('img') || 'puzzle1.png';

        let puzzleInstance = null;
        const img = new Image();

        function playSnapSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch(e) {}
        }

        function playVictorySound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                [261, 329, 392, 523, 659].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.1);
                    osc.stop(ctx.currentTime + i * 0.1 + 0.3);
                });
            } catch(e) {}
        }

        img.onerror = () => {
            document.getElementById('puzzle-holder').innerHTML = `
                <div class="error-msg">
                    ⚠️ <b>Image Not Found!</b><br><br>
                    Could not load <code>"${imageName}"</code>.<br>
                    Please upload <b>${imageName}</b> to your main GitHub folder.
                </div>`;
        };

        img.onload = () => {
            document.getElementById('puzzle-holder').innerHTML = '';

            puzzleInstance = new headbreaker.Canvas('puzzle-holder', {
                width: 320,
                height: 320,
                pieceSize: { x: 106, y: 106 },
                proximity: 20,
                borderFill: 8,
                strokeWidth: 2,
                strokeColor: '#1E293B',
                image: img,
                gridSize: { x: 3, y: 3 }
            });

            puzzleInstance.onConnect(() => {
                playSnapSound();
                if (puzzleInstance.isSolved()) {
                    playVictorySound();
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    document.getElementById('winModal').style.display = 'flex';
                }
            });

            puzzleInstance.shuffle();
            puzzleInstance.draw();
        };

        // Load image after setting handlers
        img.src = imageName;

        function shufflePuzzle() {
            if (puzzleInstance) {
                puzzleInstance.shuffle();
                puzzleInstance.draw();
            }
        }

        function closeModal() {
            document.getElementById('winModal').style.display = 'none';
            shufflePuzzle();
        }
    </script>
</body>
</html>
