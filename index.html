<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flyzen Official Pro Puzzle ✈️</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* منع تمرير الشاشة أثناء سحب البزل */
        }
        
        body {
            margin: 0;
            padding: 15px 10px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 18px 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 440px;
            width: 100%;
            border: 4px solid #38BDF8;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
            position: relative;
        }

        .flight-map-container {
            width: 100%;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 18px;
            padding: 8px 12px;
            margin-bottom: 10px;
        }

        .map-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #64748B;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .flight-path {
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .flight-path::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 15px;
            right: 15px;
            height: 3px;
            background: #CBD5E1;
            transform: translateY(-50%);
            z-index: 1;
        }

        .map-node {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #CBD5E1;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            position: relative;
            z-index: 2;
            border: 2px solid #FFFFFF;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }

        .map-node.diff-3 { background: #CD7F32 !important; color: white; border-color: #FDE68A; }
        .map-node.diff-4 { background: #94A3B8 !important; color: white; border-color: #F1F5F9; }
        .map-node.diff-5 { 
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%) !important; 
            color: white; 
            border-color: #FEF08A;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
        }

        .map-node.active {
            transform: scale(1.15);
            border-color: #0284C7 !important;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.6);
        }

        .badge {
            background: #0EA5E9;
            color: white;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        h1 { color: #0F172A; font-size: 16px; margin: 0 0 4px 0; }
        
        .current-rank-badge {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 700;
            color: #D97706;
            background: #FFFBEB;
            border: 1px dashed #F59E0B;
            padding: 3px 8px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .game-info {
            display: flex;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #0284C7;
            margin-bottom: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .info-pill {
            background: #F0F9FF;
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid #BAE6FD;
        }

        .diff-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .diff-btn {
            background: #F1F5F9;
            border: 2px solid #CBD5E1;
            color: #475569;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .diff-btn.active {
            background: #38BDF8;
            border-color: #0284C7;
            color: #FFFFFF;
        }

        #puzzle-container {
            position: relative;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }

        #puzzle-grid {
            width: 100%;
            display: grid;
            gap: 5px;
            padding: 5px;
            background: #0F172A;
            border: 4px solid #0284C7;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            background-repeat: no-repeat;
            background-size: 100% 100%;
            overflow: hidden;
        }

        /* 🧩 عناصر البزل مع دعم الحركة السلسة 🧩 */
        .tile {
            cursor: grab;
            border-radius: 10px;
            background-repeat: no-repeat;
            touch-action: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease;
            box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.7), inset -2px -2px 4px rgba(0, 0, 0, 0.4), 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 2;
        }

        .tile.correct {
            border: 1.5px solid #10B981 !important;
            box-shadow: inset 0 0 8px rgba(16, 185, 129, 0.6) !important;
        }

        /* التأثير المغناطيسي أثناء السحب الاحترافي */
        .tile.dragging {
            opacity: 0.9;
            transform: scale(1.1) rotate(2deg);
            z-index: 100 !important;
            cursor: grabbing;
            box-shadow: 0 15px 30px rgba(14, 165, 233, 0.6);
            outline: 3px solid #38BDF8;
        }

        .tile.selected {
            transform: scale(1.05);
            z-index: 10;
            outline: 3px solid #0EA5E9;
            box-shadow: 0 8px 18px rgba(14, 165, 233, 0.5);
        }

        #puzzle-grid.solved {
            gap: 0; padding: 0;
            border-color: #10B981 !important;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
        }

        #puzzle-grid.solved .tile { 
            border-radius: 0; box-shadow: none !important; border: none !important; cursor: default; 
        }

        #hint-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: 100% 100%;
            border-radius: 20px;
            z-index: 10;
            pointer-events: none;
            display: none;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            border: 4px solid #38BDF8;
        }

        .in-grid-watermark {
            position: absolute;
            bottom: 8px; right: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 8px; font-weight: 600;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.85);
            text-transform: uppercase;
            pointer-events: none;
            z-index: 6;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 6px;
        }

        .win-box {
            display: none;
            width: 100%;
            background: #ECFDF5;
            border: 3px solid #10B981;
            border-radius: 20px;
            padding: 12px;
            margin-top: 10px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .btn-group { display: flex; gap: 8px; margin-top: 12px; width: 100%; justify-content: center; }

        .btn {
            background: #0284C7;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(2, 132, 199, 0.3);
        }

        .btn-secondary { background: #64748B; }

        .page-signature {
            margin-top: 14px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 9px; font-weight: 600; letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.6); text-transform: uppercase;
        }
        .page-signature::before, .page-signature::after { content: ''; width: 20px; height: 1px; background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="card">
        <div class="flight-map-container">
            <div class="map-title" id="mapTitle">FLYZEN EASY (3x3) PATH</div>
            <div class="flight-path" id="flightPath">
                <div class="map-node" id="node-1">1</div>
                <div class="map-node" id="node-2">🔒</div>
                <div class="map-node" id="node-3">🔒</div>
                <div class="map-node" id="node-4">🔒</div>
                <div class="map-node" id="node-5">🏆</div>
            </div>
        </div>

        <span class="badge">✈️ FLYZEN OFFICIAL ACTIVITY</span>
        <h1 id="levelTitle">Level 1: Sky Explorer 🧩</h1>
        <div class="current-rank-badge" id="currentRankBadge">TARGET RANK: JUNIOR CADET 🐣</div>
        
        <div class="game-info">
            <span class="info-pill" id="timer">⏱️ 00:00</span>
            <span class="info-pill" id="bestTime">🏆 Best: --:--</span>
            <span class="info-pill" id="movesCount">👆 Moves: 0</span>
            <span class="info-pill" id="totalScore">⭐ XP: 0</span>
        </div>

        <div class="diff-selector">
            <button class="diff-btn active" onclick="changeDifficulty(3, this)">Easy (3x3)</button>
            <button class="diff-btn" onclick="changeDifficulty(4, this)">Medium (4x4)</button>
            <button class="diff-btn" onclick="changeDifficulty(5, this)">Hard (5x5)</button>
        </div>
        
        <div id="puzzle-container">
            <div id="puzzle-grid"></div>
            <div id="hint-overlay"></div>
            <div class="in-grid-watermark">BY MAZIGHI AHMED</div>
        </div>

        <div id="winBox" class="win-box">
            <h2 id="winBoxHeading" style="color: #0284C7; margin: 0; font-size: 16px;">🎉 MISSION COMPLETED! 🎉</h2>
            <div style="font-size: 24px;" id="starRating">⭐⭐⭐</div>
            <div id="winStats" style="color: #0F766E; margin: 4px 0; font-size: 11px; font-weight: bold;"></div>
            
            <div style="background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%); border: 2px dashed #0284C7; border-radius: 14px; padding: 8px; margin-top: 6px;">
                <div id="rankBadgeIcon" style="font-size: 28px;">👨‍✈️</div>
                <div id="rankTitle" style="color: #0284C7; font-size: 13px; font-weight: bold;">PROMOTED TO JUNIOR CO-PILOT!</div>
                <div id="pointsEarned" style="color: #0EA5E9; font-size: 11px; font-weight: bold;">+0 XP EARNED</div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="triggerHint()">💡 Hint</button>
            <button class="btn" id="actionBtn" onclick="shuffleTiles()">🔄 Shuffle</button>
        </div>
    </div>

    <div class="page-signature">BY MAZIGHI AHMED</div>
    <img id="secret-source" style="display:none;" />

    <script>
        const rankMatrix = {
            1: { 3: { title: "Junior Cadet 🐣", icon: "🐣" }, 4: { title: "Sky Explorer ✈️", icon: "✈️" }, 5: { title: "Master Explorer 🚀", icon: "🚀" } },
            2: { 3: { title: "Cloud Navigator ☁️", icon: "☁️" }, 4: { title: "Flight Captain 👨‍✈️", icon: "👨‍✈️" }, 5: { title: "Storm Conqueror 🌩️", icon: "🌩️" } },
            3: { 3: { title: "Jet Racer 🏎️", icon: "🏎️" }, 4: { title: "Speed Aviator ⚡", icon: "⚡" }, 5: { title: "Supersonic Ace 💥", icon: "💥" } },
            4: { 3: { title: "Star Cadet 🌟", icon: "🌟" }, 4: { title: "Wing Commander 🎖️", icon: "🎖️" }, 5: { title: "Galaxy Sentinel 🛡️", icon: "🛡️" } },
            5: { 3: { title: "Chief Commander 👑", icon: "👑" }, 4: { title: "Sky Sovereign 🌌", icon: "🌌" }, 5: { title: "SUPREME AVIATOR LEGEND 🏆", icon: "🏆" } }
        };

        let currentLevel = 1;
        let imageName = `puzzle${currentLevel}.jpg`;
        const grid = document.getElementById('puzzle-grid');
        const hiddenImg = document.getElementById('secret-source');
        const winBox = document.getElementById('winBox');
        const actionBtn = document.getElementById('actionBtn');

        let gridSize = 3;
        let currentOrder = [];
        let tileElements = [];
        let moves = 0;
        let timerInterval = null;
        let secondsPassed = 0;
        let selectedIndex = null;

        /* 📳 مشغل الاهتزاز اللمسي الصوتي 📳 */
        function triggerHaptic(type = 'tap') {
            if ('vibrate' in navigator) {
                if (type === 'tap') navigator.vibrate(15);
                if (type === 'drop') navigator.vibrate([20, 30, 20]);
                if (type === 'win') navigator.vibrate([100, 50, 100, 50, 200]);
            }
        }

        function updateFlightMap() {
            const diffName = gridSize === 3 ? "EASY (3x3)" : (gridSize === 4 ? "MEDIUM (4x4)" : "HARD (5x5)");
            document.getElementById('mapTitle').innerText = `FLYZEN ${diffName} PATH`;
            let maxUnlocked = parseInt(localStorage.getItem(`flyzen_max_unlocked_grid_${gridSize}`)) || 1;

            for (let i = 1; i <= 5; i++) {
                const node = document.getElementById(`node-${i}`);
                node.className = 'map-node';
                let isDone = localStorage.getItem(`lvl_${i}_grid_${gridSize}_done`);
                if (isDone) {
                    node.classList.add(`diff-${gridSize}`);
                    node.innerText = gridSize === 3 ? '🥉' : (gridSize === 4 ? '🥈' : '🥇');
                } else if (i <= maxUnlocked) {
                    node.innerText = i;
                } else {
                    node.innerText = i === 5 ? '🏆' : '🔒';
                }
                if (i === currentLevel) node.classList.add('active');
            }
        }

        function updateRankTargetUI() {
            const currentRank = rankMatrix[currentLevel][gridSize];
            document.getElementById('currentRankBadge').innerText = `TARGET RANK: ${currentRank.title.toUpperCase()}`;
        }

        function changeDifficulty(size, btn) {
            gridSize = size;
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateRankTargetUI();
            updateFlightMap();
            initGame();
        }

        function createDOMGrid() {
            grid.innerHTML = '';
            tileElements = [];
            const total = gridSize * gridSize;

            for (let i = 0; i < total; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.style.backgroundImage = `url('${imageName}')`;
                tile.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
                
                // 🖐️ إعداد محرك السحب والضغط الهجين 🖐️
                setupHybridTouch(tile, i);

                grid.appendChild(tile);
                tileElements.push(tile);
            }
        }

        /* 🚀 محرك السحب والضغط الهجين (Hybrid Drag & Tap Engine) 🚀 */
        let draggedIndex = null;
        let startX = 0, startY = 0;
        let isDragging = false;

        function setupHybridTouch(tile, index) {
            tile.addEventListener('pointerdown', (e) => {
                if (grid.classList.contains('solved')) return;
                draggedIndex = index;
                startX = e.clientX;
                startY = e.clientY;
                isDragging = false;
                tile.setPointerCapture(e.pointerId);
                triggerHaptic('tap');
            });

            tile.addEventListener('pointermove', (e) => {
                if (draggedIndex === null || grid.classList.contains('solved')) return;
                let dist = Math.hypot(e.clientX - startX, e.clientY - startY);
                if (dist > 8) { // بدء تقنية السحب عند تجاوز المسافة الخفيفة
                    isDragging = true;
                    tile.classList.add('dragging');
                }
            });

            tile.addEventListener('pointerup', (e) => {
                if (draggedIndex === null) return;
                tile.releasePointerCapture(e.pointerId);
                tile.classList.remove('dragging');

                if (isDragging) {
                    // العثور على العنصر المستهدف أسفل إصبع الطفل
                    let dropTarget = document.elementFromPoint(e.clientX, e.clientY);
                    let targetTile = dropTarget ? dropTarget.closest('.tile') : null;
                    if (targetTile) {
                        let targetIndex = tileElements.indexOf(targetTile);
                        if (targetIndex !== -1 && targetIndex !== draggedIndex) {
                            swapPieces(draggedIndex, targetIndex);
                            triggerHaptic('drop');
                        }
                    }
                } else {
                    // في حال الضغط الخفيف (Tap)
                    handleTap(draggedIndex);
                }
                draggedIndex = null;
            });
        }

        function handleTap(index) {
            if (selectedIndex === null) {
                selectedIndex = index;
            } else if (selectedIndex === index) {
                selectedIndex = null;
            } else {
                swapPieces(selectedIndex, index);
                selectedIndex = null;
            }
            updateGridUI();
        }

        function swapPieces(idx1, idx2) {
            let temp = currentOrder[idx1];
            currentOrder[idx1] = currentOrder[idx2];
            currentOrder[idx2] = temp;
            moves++;
            document.getElementById('movesCount').innerText = `👆 Moves: ${moves}`;
            updateGridUI();
            checkWin();
        }

        function updateGridUI() {
            tileElements.forEach((tile, index) => {
                const pieceId = currentOrder[index];
                const origCol = pieceId % gridSize;
                const origRow = Math.floor(pieceId / gridSize);
                const posX = (origCol / (gridSize - 1)) * 100;
                const posY = (origRow / (gridSize - 1)) * 100;
                
                tile.style.backgroundPosition = `${posX}% ${posY}%`;
                if (pieceId === index && !grid.classList.contains('solved')) {
                    tile.classList.add('correct');
                } else {
                    tile.classList.remove('correct');
                }
                if (selectedIndex === index) {
                    tile.classList.add('selected');
                } else {
                    tile.classList.remove('selected');
                }
            });
        }

        function initGame() {
            grid.style.aspectRatio = `1 / 1`;
            grid.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;
            createDOMGrid();
            currentOrder = Array.from({length: gridSize * gridSize}, (_, i) => i);
            shuffleTiles();
        }

        function shuffleTiles() {
            grid.classList.remove('solved');
            winBox.style.display = 'none';
            moves = 0;
            document.getElementById('movesCount').innerText = `👆 Moves: 0`;
            do {
                currentOrder.sort(() => Math.random() - 0.5);
            } while (currentOrder.every((val, index) => val === index));
            selectedIndex = null;
            updateGridUI();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            secondsPassed = 0;
            timerInterval = setInterval(() => {
                secondsPassed++;
                const m = String(Math.floor(secondsPassed / 60)).padStart(2, '0');
                const s = String(secondsPassed % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `⏱️ ${m}:${s}`;
            }, 1000);
        }

        function triggerHint() {
            const hintOverlay = document.getElementById('hint-overlay');
            hintOverlay.style.backgroundImage = `url('${imageName}')`;
            hintOverlay.style.display = 'block';
            setTimeout(() => { hintOverlay.style.display = 'none'; }, 2500);
        }

        function checkWin() {
            if (currentOrder.every((val, index) => val === index)) {
                clearInterval(timerInterval);
                grid.classList.add('solved');
                triggerHaptic('win');
                confetti({ particleCount: 150, spread: 90 });
                localStorage.setItem(`lvl_${currentLevel}_grid_${gridSize}_done`, 'true');
                winBox.style.display = 'block';
            }
        }

        hiddenImg.onload = () => initGame();
        hiddenImg.src = imageName;
    </script>
</body>
</html>
